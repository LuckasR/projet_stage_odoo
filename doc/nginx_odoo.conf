# Odoo derrière nginx : pages sur 8069, temps réel (websocket) sur 8072.
# Indispensable avec workers > 0, sinon les messages (Discuss, Miro Assistant,
# notifications) n'apparaissent qu'après un rafraîchissement de la page.
#
#   sudo cp doc/nginx_odoo.conf /etc/nginx/sites-available/odoo
#   sudo ln -s /etc/nginx/sites-available/odoo /etc/nginx/sites-enabled/odoo
#   sudo nginx -t && sudo systemctl reload nginx
#
# Puis ouvrir http://localhost:8080 (et non plus :8069).

upstream odoo_http {
    server 127.0.0.1:8069;
}
upstream odoo_websocket {
    server 127.0.0.1:8072;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name localhost;

    client_max_body_size 200m;          # import de plans DWG/DXF
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    location /websocket {
        proxy_pass http://odoo_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://odoo_http;
        proxy_redirect off;
    }
}
